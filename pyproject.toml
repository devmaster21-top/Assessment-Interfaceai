[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interface-ai-computer-use"
version = "0.1.0"
description = "LLM discovery + deterministic replay computer-use automation take-home"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "playwright>=1.50",
  "pydantic>=2.9",
  "google-genai",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
cuagent = "cuagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
